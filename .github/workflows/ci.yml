name: production-v2-ci

on:
  push:
    branches: [production-v2]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Klanata.Web/package-lock.json
      - name: Verify Phase 1
        shell: powershell
        run: ./scripts/verify-phase1.ps1
